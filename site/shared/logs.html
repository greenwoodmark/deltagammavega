    ul { margin: 22px 0; padding-left: 22px; }

    a { color: #075985; }

      <p id="refresh-status" class="notice" hidden></p>
    </div>
  </main>
<script>
  fetch('data/refresh_status.json', { cache: 'no-store' }).then(response => {
    if (!response.ok) throw new Error(`Refresh status request failed: ${response.status}`);
    return response.json();
  }).then(status => {
    const node = document.getElementById('refresh-status');
    if (status.overall_status === 'success') return;
    const failed = Object.entries(status.stages || {}).filter(([, stage]) => ['failed', 'blocked'].includes(stage.status)).map(([name, stage]) => `${name}: ${stage.status}`).join('; ');
    node.hidden = false;
    node.textContent = `Refresh status: ${status.overall_status}. ${failed || 'Check the individual page status.'}`;
  }).catch(() => {});
</script>
</body>
