name: Validate and publish CPURNSA curve and PCA data

on:
  push:
    branches:
      - main
    paths:
      - "data/cpurnsa_snapshots/**"
      - "data/cpurnsa_pca_diagnostics.json"
      - "data/uscpi_release_manifest.json"
      - "site/shared/**"
      - "tools/build_site.py"
      - "tools/validate_public_build.py"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cpurnsa-data-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate committed sanitized model handoff
        run: |
          python tools/validate_uscpi_public_data.py \
            --snapshot-dir data/cpurnsa_snapshots \
            --pca-path data/cpurnsa_pca_diagnostics.json \
            --manifest-path data/uscpi_release_manifest.json \
            --curve-path data/cpurnsa_curve_history.json

      - name: Rebuild public CPURNSA JSON
        run: |
          python tools/publish_cpurnsa.py \
            --input-dir data/cpurnsa_snapshots \
            --output-dir data

      - name: Validate rebuilt public data
        run: |
          python tools/validate_uscpi_public_data.py \
            --snapshot-dir data/cpurnsa_snapshots \
            --pca-path data/cpurnsa_pca_diagnostics.json \
            --manifest-path data/uscpi_release_manifest.json \
            --curve-path data/cpurnsa_curve_history.json \
            --commentary-path data/cpurnsa_daily_commentary.json

      - name: Assemble and validate Firebase public build
        run: |
          python tools/build_site.py --target public
          python tools/validate_public_build.py build/public

      # These files are generated outputs. GitHub Actions is their sole writer;
      # normal developer commits should contain the source inputs only.
      - name: Commit generated public data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- \
            data/cpurnsa_curve_history.json \
            data/cpurnsa_daily_commentary.json \
            data/health.json; then
            echo "No generated public curve changes"
            exit 0
          fi
          git add \
            data/cpurnsa_curve_history.json \
            data/cpurnsa_daily_commentary.json \
            data/health.json
          git commit -m "Update CPURNSA curve data"
          git push

      # ---------------------------------------------------------------------
      # Automated Firebase Hosting deploy (replaces the manual
      # deploy_public_site.sh DEPLOY gate for the CI path).
      #
      # Publishes the freshly assembled build/public to live Firebase Hosting
      # so the site (https://www.deltagammavega.com/cpurnsa.html) stays in sync
      # on every successful run. This runs regardless of whether the commit
      # step found a diff, because build/public is reassembled fresh each run;
      # a no-diff run still re-publishes the current build. It only runs when
      # every preceding build/validation step succeeded: these are plain
      # sequential steps (no `if: always()`), so a validation failure aborts
      # the job before reaching the deploy.
      #
      # Required GitHub Actions repository secret:
      #   FIREBASE_SERVICE_ACCOUNT - the full JSON of a Google Cloud service
      #       account key with Firebase Hosting deploy permissions on project
      #       deltagammavega-46877 (roles/firebasehosting.admin or equivalent).
      #
      # Optional legacy fallback secret (deprecated path):
      #   FIREBASE_TOKEN - a `firebase login:ci` CI token. Used only if
      #       FIREBASE_SERVICE_ACCOUNT is not set. `firebase deploy --token` is
      #       deprecated by firebase-tools; prefer the service account.
      #
      # The project id is taken from the repo-root .firebaserc (default project
      # deltagammavega-46877), so --project is intentionally omitted.
      # ---------------------------------------------------------------------
      # Pin firebase-tools to a known-good version. An unpinned `latest` install
      # pulled a CI auth regression (firebase/firebase-tools #10716, #10726) where
      # `firebase deploy` silently ignores GOOGLE_APPLICATION_CREDENTIALS and fails
      # with "Failed to authenticate, have you run firebase login?". That regression
      # is what broke the 2026-10-22/23 runs (deploy died in ~2-3s at auth, while the
      # 2026-10-21 run on an older CLI succeeded). Issue #10716 confirms pinning to
      # 15.22.1 resolves it. Bump this pin deliberately after verifying a release is
      # safe on the service-account/ADC deploy path.
      - name: Install firebase-tools
        run: npm install -g firebase-tools@15.22.1

      - name: Deploy public build to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            # Primary: authenticate via a service account key file.
            cred_file="$(mktemp)"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$cred_file"
            export GOOGLE_APPLICATION_CREDENTIALS="$cred_file"
            trap 'rm -f "$cred_file"' EXIT
            firebase deploy --only hosting --non-interactive
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            # Fallback: deprecated CI token.
            firebase deploy --only hosting --non-interactive --token "$FIREBASE_TOKEN"
          else
            echo "::error::Neither FIREBASE_SERVICE_ACCOUNT nor FIREBASE_TOKEN secret is set; cannot deploy." >&2
            exit 1
          fi
