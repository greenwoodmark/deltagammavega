name: Validate and publish CPURNSA curve and PCA data

on:
  push:
    branches:
      - main
    paths:
      - "data/cpurnsa_snapshots/**"
      - "data/cpurnsa_pca_diagnostics.json"
      - "data/uscpi_release_manifest.json"
      - "data/cpi_prediction_markets.json"
      - "site/shared/**"
      - "site/shared/cpi_prediction_markets.html"
      - "tools/build_site.py"
      - "tools/validate_public_build.py"
      - "tools/validate_cpi_prediction_markets_data.py"
      - "firebase.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-site-deploy
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate committed sanitized model handoff
        run: |
          python tools/validate_uscpi_public_data.py \
            --snapshot-dir data/cpurnsa_snapshots \
            --pca-path data/cpurnsa_pca_diagnostics.json \
            --manifest-path data/uscpi_release_manifest.json \
            --curve-path data/cpurnsa_curve_history.json

      - name: Rebuild public CPURNSA JSON
        run: |
          python tools/publish_cpurnsa.py \
            --input-dir data/cpurnsa_snapshots \
            --output-dir data

      - name: Validate rebuilt public data
        run: |
          python tools/validate_uscpi_public_data.py \
            --snapshot-dir data/cpurnsa_snapshots \
            --pca-path data/cpurnsa_pca_diagnostics.json \
            --manifest-path data/uscpi_release_manifest.json \
            --curve-path data/cpurnsa_curve_history.json \
            --commentary-path data/cpurnsa_daily_commentary.json

      - name: Validate CPI prediction-markets data
        run: |
          python tools/validate_cpi_prediction_markets_data.py \
            data/cpi_prediction_markets.json

      - name: Assemble and validate Firebase public build
        run: |
          python tools/build_site.py --target public
          python tools/validate_public_build.py build/public

      # These files are generated outputs. GitHub Actions is their sole writer;
      # normal developer commits should contain the source inputs only.
      - name: Commit generated public data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- \
            data/cpurnsa_curve_history.json \
            data/cpurnsa_daily_commentary.json \
            data/health.json; then
            echo "No generated public curve changes"
            exit 0
          fi
          git add \
            data/cpurnsa_curve_history.json \
            data/cpurnsa_daily_commentary.json \
            data/health.json
          git commit -m "Update CPURNSA curve data"
          git push

      # Firebase Hosting deployment is intentionally not performed in GitHub
      # Actions. The Linux-box cron job
      # /home/mark/trading_env/ops/run_softs_diagnostics_deploy.sh owns the
      # single daily Firebase deployment using the existing local Firebase
      # credentials. It deploys the exact origin/main revision after CPURNSA,
      # Kalshi, and other generated data handoffs have arrived. Keeping deploy
      # ownership there matches the working CPURNSA process and avoids a second
      # credential/configuration path in GitHub Actions.
      - name: Record deployment owner
        run: echo "Firebase deployment is owned by the Linux-box cron deployer."